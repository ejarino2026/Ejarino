<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اجارینو</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#f5f6f8;
color:#222;
padding-bottom:80px
}

header{
background:#fff;
padding:15px;
position:sticky;
top:0;
z-index:10;
box-shadow:0 2px 10px #0001
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px
}

.logo{
font-size:25px;
font-weight:bold
}

.account-btn{
border:0;
background:#f0f1f3;
padding:10px 13px;
border-radius:12px;
font-size:13px;
cursor:pointer
}

.search{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:14px;
font-size:15px;
outline:none
}

.container{
padding:18px;
max-width:700px;
margin:auto
}

.categories{
display:flex;
gap:8px;
overflow:auto;
padding:5px 0 15px
}

.cat{
background:#fff;
border:1px solid #ddd;
border-radius:20px;
padding:9px 15px;
white-space:nowrap;
cursor:pointer
}

.cat.active{
background:#222;
color:#fff
}

.hero{
background:#222;
color:#fff;
border-radius:20px;
padding:25px 20px;
margin-bottom:20px
}

.hero h1{
margin:0 0 10px;
font-size:24px
}

.hero p{
margin:0;
line-height:1.8;
color:#ddd
}

.btn{
border:0;
background:#222;
color:#fff;
padding:13px 18px;
border-radius:13px;
font-size:15px;
cursor:pointer
}

.hero .btn{
background:#fff;
color:#222;
margin-top:15px
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin:20px 0 12px
}

.section-title h2{
font-size:20px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.card{
background:#fff;
border-radius:17px;
overflow:hidden;
box-shadow:0 2px 10px #0000000d;
cursor:pointer
}

.card-img{
height:130px;
background:#e9eaed;
display:flex;
align-items:center;
justify-content:center;
font-size:45px
}

.card-body{
padding:12px
}

.card h3{
font-size:16px;
margin:0 0 8px
}

.card p{
margin:5px 0;
color:#777;
font-size:13px
}

.price{
font-weight:bold;
color:#111;
font-size:15px
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:100;
align-items:flex-end;
justify-content:center
}

.modal-box{
background:#fff;
width:100%;
max-width:700px;
border-radius:25px 25px 0 0;
padding:22px;
max-height:90vh;
overflow:auto
}

.modal-box h2{
margin-top:0
}

input,select{
width:100%;
padding:13px;
margin:7px 0 12px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
outline:none
}

.close{
float:left;
font-size:28px;
cursor:pointer
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#fff;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -2px 10px #0001;
z-index:20
}

nav button{
background:none;
border:0;
font-size:13px;
cursor:pointer
}

.empty{
text-align:center;
padding:30px;
color:#888;
grid-column:1/-1
}

.status{
padding:12px;
border-radius:12px;
background:#f1f2f4;
font-size:13px;
line-height:1.8;
margin-bottom:12px;
display:none
}

.user-box{
background:#f3f4f6;
padding:15px;
border-radius:14px;
margin-bottom:15px;
line-height:2
}

.link-btn{
border:0;
background:none;
width:100%;
padding:13px;
font-size:14px;
cursor:pointer;
color:#333
}

.logout{
background:#c62828;
width:100%;
margin-top:8px
}

.small{
font-size:12px;
color:#777;
line-height:1.8
}

@media(max-width:400px){
.grid{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<header>

<div class="topbar">

<div class="logo">
اجارینو 🏠
</div>

<button class="account-btn" onclick="openAuth()">
👤 حساب من
</button>

</div>

<input
class="search"
id="search"
placeholder="چی می‌خوای اجاره کنی؟"
>

</header>

<main class="container">

<div class="hero">

<h1>
هر چیزی داری، اجاره بده!
</h1>

<p>
در اجارینو وسایل مورد نیازت رو پیدا کن یا وسایلی که داری رو برای اجاره قرار بده.
</p>

<button class="btn" onclick="openModal()">
+ ثبت وسیله برای اجاره
</button>

</div>


<div class="categories">

<button class="cat active" onclick="filterCat('همه',this)">
همه
</button>

<button class="cat" onclick="filterCat('لوازم خانگی',this)">
🏠 لوازم خانگی
</button>

<button class="cat" onclick="filterCat('خودرو',this)">
🚗 خودرو
</button>

<button class="cat" onclick="filterCat('ورزشی',this)">
🏋️ ورزشی
</button>

<button class="cat" onclick="filterCat('دیجیتال',this)">
📱 دیجیتال
</button>

<button class="cat" onclick="filterCat('ابزار',this)">
🔧 ابزار
</button>

</div>


<div class="section-title">

<h2>
وسایل نزدیک شما
</h2>

<span id="count"></span>

</div>


<div class="grid" id="items"></div>

</main>


<nav>

<button onclick="window.scrollTo({top:0,behavior:'smooth'})">
🏠<br>خانه
</button>

<button onclick="document.getElementById('search').focus()">
🔍<br>جستجو
</button>

<button onclick="openModal()">
➕<br>اجاره بده
</button>

<button onclick="openAuth()">
👤<br>حساب من
</button>

</nav>


<!-- ثبت وسیله -->

<div class="modal" id="modal">

<div class="modal-box">

<span class="close" onclick="closeModal()">×</span>

<h2>
ثبت وسیله برای اجاره
</h2>

<p class="small">
برای ثبت وسیله باید وارد حساب کاربری خودت باشی.
</p>

<label>
نام وسیله
</label>

<input
id="name"
placeholder="مثلاً دریل برقی"
>

<label>
دسته‌بندی
</label>

<select id="category">

<option>لوازم خانگی</option>
<option>خودرو</option>
<option>ورزشی</option>
<option>دیجیتال</option>
<option>ابزار</option>

</select>

<label>
قیمت اجاره روزانه (تومان)
</label>

<input
id="price"
type="number"
placeholder="مثلاً 300000"
>

<label>
شهر
</label>

<input
id="city"
placeholder="مثلاً تهران"
>

<button
class="btn"
style="width:100%"
onclick="addItem()"
>
ثبت وسیله
</button>

</div>

</div>


<!-- حساب کاربری -->

<div class="modal" id="authModal">

<div class="modal-box">

<span class="close" onclick="closeAuth()">×</span>

<h2 id="authTitle">
ورود به اجارینو
</h2>

<div id="authStatus" class="status"></div>

<div id="loggedUser" style="display:none">

<div class="user-box">

<strong>
حساب شما
</strong>

<br>

<span id="userEmail"></span>

</div>

<button
class="btn logout"
onclick="logout()"
>
خروج از حساب
</button>

</div>


<div id="authForm">

<label>
ایمیل
</label>

<input
id="authEmail"
type="email"
placeholder="example@gmail.com"
>

<label>
رمز عبور
</label>

<input
id="authPassword"
type="password"
placeholder="حداقل 6 کاراکتر"
>

<button
class="btn"
style="width:100%"
id="authSubmit"
onclick="submitAuth()"
>
ورود
</button>

<button
class="link-btn"
id="authSwitch"
onclick="toggleAuthMode()"
>
حساب ندارم؛ ثبت‌نام می‌کنم
</button>

</div>

</div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://hwejixmfomzsjazntpo.supabase.co';


const SUPABASE_PUBLISHABLE_KEY =
'PASTE_YOUR_PUBLISHABLE_KEY_HERE';


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


let session = null;

let authMode = 'login';

let currentCategory = 'همه';


let items = [

{
name:'دوربین حرفه‌ای',
category:'دیجیتال',
price:'800,000',
city:'تهران',
icon:'📷'
},

{
name:'دریل برقی',
category:'ابزار',
price:'250,000',
city:'تهران',
icon:'🔧'
},

{
name:'دوچرخه کوهستان',
category:'ورزشی',
price:'300,000',
city:'تهران',
icon:'🚲'
},

{
name:'مبل راحتی',
category:'لوازم خانگی',
price:'500,000',
city:'تهران',
icon:'🛋️'
},

{
name:'کنسول بازی',
category:'دیجیتال',
price:'600,000',
city:'تهران',
icon:'🎮'
},

{
name:'ماشین',
category:'خودرو',
price:'2,500,000',
city:'تهران',
icon:'🚗'
}

];


function render(){

let search =
document.getElementById('search').value
.toLowerCase()
.trim();


let filtered =
items.filter(function(x){

let categoryOK =
currentCategory === 'همه' ||
x.category === currentCategory;

let searchOK =
x.name.toLowerCase().includes(search) ||
x.city.toLowerCase().includes(search);

return categoryOK && searchOK;

});


document.getElementById('count').innerText =
filtered.length + ' مورد';


let box =
document.getElementById('items');


if(filtered.length === 0){

box.innerHTML =
'<div class="empty">موردی پیدا نشد 😕</div>';

return;

}


box.innerHTML =
filtered.map(function(x){

return `

<div class="card">

<div class="card-img">
${x.icon}
</div>

<div class="card-body">

<h3>
${x.name}
</h3>

<p>
📍 ${x.city}
</p>

<p>
${x.category}
</p>

<div class="price">
${x.price} تومان / روز
</div>

</div>

</div>

`;

}).join('');

}


function filterCat(category, button){

currentCategory = category;

document
.querySelectorAll('.cat')
.forEach(function(x){
x.classList.remove('active');
});

button.classList.add('active');

render();

}


document
.getElementById('search')
.addEventListener('input',render);


function openModal(){

if(!session){

openAuth();

showAuthStatus(
'برای ثبت وسیله ابتدا وارد حساب کاربری شوید.',
false
);

return;

}

document.getElementById('modal').style.display =
'flex';

}


function closeModal(){

document.getElementById('modal').style.display =
'none';

}


function addItem(){

if(!session){

closeModal();

openAuth();

showAuthStatus(
'برای ثبت وسیله ابتدا وارد حساب کاربری شوید.',
false
);

return;

}


let name =
document.getElementById('name').value.trim();

let category =
document.getElementById('category').value;

let price =
document.getElementById('price').value;

let city =
document.getElementById('city').value.trim();


if(!name || !price || !city){

alert('لطفاً همه اطلاعات را وارد کن.');

return;

}


items.unshift({

name:name,

category:category,

price:Number(price).toLocaleString('en-US'),

city:city,

icon:
category === 'خودرو' ? '🚗' :
category === 'ورزشی' ? '🏋️' :
category === 'دیجیتال' ? '📱' :
category === 'ابزار' ? '🔧' : '🏠'

});


render();

closeModal();


document.getElementById('name').value='';
document.getElementById('price').value='';
document.getElementById('city').value='';


alert(
'وسیله با موفقیت ثبت شد.\
\
در نسخه بعدی، اطلاعات وسیله به دیتابیس اجارینو منتقل می‌شود.'
);

}


function openAuth(){

document.getElementById('authModal').style.display =
'flex';

updateAuthUI();

}


function closeAuth(){

document.getElementById('authModal').style.display =
'none';

}


function showAuthStatus(message, success){

let box =
document.getElementById('authStatus');

box.style.display='block';

box.innerText=message;

}


function updateAuthUI(){

let logged =
document.getElementById('loggedUser');

let form =
document.getElementById('authForm');

let title =
document.getElementById('authTitle');

if(session){

logged.style.display='block';

form.style.display='none';

document.getElementById('userEmail').innerText =
session.user.email;

title.innerText =
'حساب کاربری';

}else{

logged.style.display='none';

form.style.display='block';

title.innerText =
authMode === 'login'
? 'ورود به اجارینو'
: 'ثبت‌نام در اجارینو';

document.getElementById('authSubmit').innerText =
authMode === 'login'
? 'ورود'
: 'ثبت‌نام';

document.getElementById('authSwitch').innerText =
authMode === 'login'
? 'حساب ندارم؛ ثبت‌نام می‌کنم'
: 'قبلاً ثبت‌نام کرده‌ام؛ ورود';

}

}


function toggleAuthMode(){

authMode =
authMode === 'login'
? 'signup'
: 'login';

document.getElementById('authStatus').style.display =
'none';

updateAuthUI();

}


async function submitAuth(){

let email =
document.getElementById('authEmail').value.trim();

let password =
document.getElementById('authPassword').value;


if(!email || !password){

showAuthStatus(
'ایمیل و رمز عبور را وارد کن.',
false
);

return;

}


if(password.length < 6){

showAuthStatus(
'رمز عبور باید حداقل ۶ کاراکتر باشد.',
false
);

return;

}


let button =
document.getElementById('authSubmit');

button.disabled=true;

button.innerText='لطفاً صبر کن...';


try{

if(authMode === 'signup'){

const {data,error} =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
emailRedirectTo:
window.location.origin +
window.location.pathname
}

});


if(error) throw error;


if(data.session){

session=data.session;

showAuthStatus(
'ثبت‌نام با موفقیت انجام شد.',
true
);

updateAuthUI();

}else{

showAuthStatus(
'ثبت‌نام انجام شد. ایمیل تأیید برایت ارسال شد. وارد ایمیلت شو و روی لینک تأیید بزن.',
true
);

}

}else{


const {data,error} =
await supabaseClient.auth.signInWithPassword({

email:email,

password:password

});


if(error) throw error;


session=data.session;

showAuthStatus(
'با موفقیت وارد شدی ✅',
true
);

updateAuthUI();

}

}catch(error){

showAuthStatus(
'خطا: ' + error.message,
false
);

}


button.disabled=false;

if(!session){

button.innerText =
authMode === 'login'
? 'ورود'
: 'ثبت‌نام';

}

}


async function logout(){

await supabaseClient.auth.signOut();

session=null;

authMode='login';

updateAuthUI();

showAuthStatus(
'از حساب خارج شدی.',
true
);

}


async function initAuth(){

const {data} =
await supabaseClient.auth.getSession();

session =
data.session;

updateAuthUI();


supabaseClient.auth.onAuthStateChange(
function(event,newSession){

session =
newSession;

updateAuthUI();

}
);

}


render();

initAuth();

</script>

</body>
</html>
